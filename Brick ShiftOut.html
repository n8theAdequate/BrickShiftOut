// === LEVEL INTRO SPAWN ANIMATION TUNING ===
const LEVEL_INTRO_Y_OFFSET = 300;     // start this far below locked position
const LEVEL_INTRO_RISE_DUR = 66;      // frames @60fps (~1.1s) buoyant rise
const LEVEL_INTRO_FADE_DUR = 12;      // frames @60fps (~0.2s) quick fade-in
const LEVEL_INTRO_ROW_DELAY_START = 9.0;   // frames between early rows (~0.15s)
const LEVEL_INTRO_ROW_DELAY_END   = 0.6;   // frames between late rows (almost instant)
const LEVEL_INTRO_ROW_DELAY_POW   = 2.2;   // higher = faster ramp to 'instant'
const LEVEL_INTRO_JITTER = 3.5;       // per-brick timing jitter in frames
const LEVEL_INTRO_SCALE_FROM = 0.70;  // bricks scale from this to 1.0 during intro
const LEVEL_INTRO_X_MULT = 2.8;       // crank lateral wobble (damped to 0 at lock)

// Undulation placeholders (kept at zero until you ask for it)
const LEVEL_INTRO_UND_AMP = 12.0;      // px (champagne bubbles)
const LEVEL_INTRO_UND_FREQ = 0.20;    // cycles per frame unit (dtSim)

function introRowStartFrames(rowIdx, rowCount) {
  if (rowCount <= 1) return 0;
  const t = Math.max(0, Math.min(1, rowIdx / (rowCount - 1)));
  // delays shrink over time: enjoy first rows, then accelerate into gameplay
  const delay = LEVEL_INTRO_ROW_DELAY_END + (LEVEL_INTRO_ROW_DELAY_START - LEVEL_INTRO_ROW_DELAY_END) * Math.pow(1 - t, LEVEL_INTRO_ROW_DELAY_POW);
  // Convert "per-row delay" into a cumulative start by summing a closed-form approximation:
  // We accumulate delays for each preceding row.
  let sum = 0;
  for (let i = 0; i < rowIdx; i++) {
    const ti = i / (rowCount - 1);
    const di = LEVEL_INTRO_ROW_DELAY_END + (LEVEL_INTRO_ROW_DELAY_START - LEVEL_INTRO_ROW_DELAY_END) * Math.pow(1 - ti, LEVEL_INTRO_ROW_DELAY_POW);
    sum += di;
  }
  return sum;
}

function clamp01(v) { return (v < 0) ? 0 : (v > 1 ? 1 : v); }


function drawImageCover(img, dx, dy, dw, dh) {
  if (!img || !img.complete || !img.naturalWidth) return;
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const s = Math.max(dw / iw, dh / ih); // cover
  const sw = iw * s, sh = ih * s;
  const x = dx + (dw - sw) * 0.5;
  const y = dy + (dh - sh) * 0.5;
  ctx.drawImage(img, x, y, sw, sh);
}

function resetTrailToBall() {
  // Keep trail anchored to the ball whenever we hard-place the ball (dock/spawn/reset).
  trailLastX = ball.x;
  trailLastY = ball.y;
  ball.px = ball.x;
  ball.py = ball.y;
  ballTrail.length = 0;
  ballWasActive = false;
}

function easeOutSine(t) { return Math.sin((t * Math.PI) / 2); }

function initLevelIntroAnimation() {
  // Build per-brick schedules: row-based stagger + tiny per-brick jitter.
  levelIntro.active = true;
  levelIntro.t = 0;
  let maxEnd = 0;

  // Determine a stable top-to-bottom ordering by row index.
    // Build a safe timing map that skips empty rows WITHOUT touching layout.
  // We keep real grid rows for positioning, but compress only the stagger timing.
  const nonEmptyRows = Array.from(new Set(bricks.map(b => (typeof b.row === 'number') ? b.row : 0)))
    .sort((a, b) => a - b);
  const rowToAnim = new Map();
  nonEmptyRows.forEach((r, idx) => rowToAnim.set(r, idx));

  bricks.forEach(b => {
    const realRow = (typeof b.row === 'number') ? b.row : 0;
    const animRow = rowToAnim.has(realRow) ? rowToAnim.get(realRow) : 0;
    const baseStart = introRowStartFrames(animRow, nonEmptyRows.length);
    const jitter = (Math.random() * 2 - 1) * LEVEL_INTRO_JITTER;
    const start = Math.max(0, baseStart + jitter);

    b.spawn = {
      start: start,
      dur: LEVEL_INTRO_RISE_DUR,
      fade: LEVEL_INTRO_FADE_DUR,
      yOff: LEVEL_INTRO_Y_OFFSET,
      undAmp: LEVEL_INTRO_UND_AMP,
      undFreq: LEVEL_INTRO_UND_FREQ,
      undPhase: Math.random() * Math.PI * 2,
      popDone: false
    };
    b.isSpawning = true;

    const endT = start + LEVEL_INTRO_RISE_DUR;
    if (endT > maxEnd) maxEnd = endT;
  });

  levelIntro.end = maxEnd;
  gamePhase = 'INTRO';

  // Ensure ball cannot appear or interact during intro.
  ball.active = false;
  ball.state = "hidden";
  ballSpawnFx.active = false;
  ballRenderAlpha = 0.0;
}

function updateLevelIntroAnimation() {
  if (!levelIntro.active) return;
  levelIntro.t += dtSim;

  // Update per-brick spawning flag so collision can stay clean if anything checks it.
  bricks.forEach(b => {
    if (!b.spawn) { b.isSpawning = false; return; }
    const t = levelIntro.t - b.spawn.start;
    b.isSpawning = (t < b.spawn.dur);
      // Intro pop: emit once when this brick first becomes visible (start of its rise)
      if (!b.spawn.popDone && t >= 0) {
        b.spawn.popDone = true;
        try { createIntroPop(b.x, b.y + b.spawn.yOff); } catch(e) {}
      }
  });

  if (levelIntro.t >= levelIntro.end) {
    levelIntro.active = false;
    // Intro finished: now we can spawn/dock the ball and allow full gameplay.
    gamePhase = 'PLAY';
    dockBallToPaddle();
  }
}

function getBrickIntroDrawState(b) {
  // Returns {x,y,alpha,scale,shadow} for current frame.
  if (!levelIntro.active || !b.spawn) return { x: b.x, y: b.y, alpha: 1, scale: 1, shadow: 0 };

  const t = levelIntro.t - b.spawn.start;
  if (t <= 0) return { x: b.x, y: b.y + b.spawn.yOff, alpha: 0, scale: LEVEL_INTRO_SCALE_FROM, shadow: 1 };

  const p = clamp01(t / Math.max(1, b.spawn.dur));
  const e = easeOutSine(p);

  // Damping ramps: lots of motion early, dead-still at lock.
  const damp1 = (1 - p);
  const damp2 = damp1 * damp1;

  // Champagne-bubble wobble: lively lateral drift + softer vertical bob.
  const amp = (b.spawn.undAmp || 0);
  const f   = (b.spawn.undFreq || 0);
  const ph  = (b.spawn.undPhase || 0);

  const undY = (amp > 0)
    ? (Math.sin((levelIntro.t * f) + ph) * amp * 0.85 * damp2
       + Math.cos((levelIntro.t * f * 0.72) + ph * 1.41) * amp * 0.30 * damp1)
    : 0;

  const undX = (amp > 0)
    ? (Math.sin((levelIntro.t * f * 1.23) + ph * 0.83) * amp * LEVEL_INTRO_X_MULT * damp2
       + Math.cos((levelIntro.t * f * 0.49) + ph * 2.11) * amp * (0.55 * damp1))
    : 0;

  const y = (b.y + b.spawn.yOff * (1 - e)) + undY;
  const x = b.x + undX;

  // Fade in from shadow (shadow peels off as alpha rises)
  const a = clamp01(t / Math.max(1, b.spawn.fade));
  const shadow = clamp01(1 - a);

  // Scale up during rise
  const s = LEVEL_INTRO_SCALE_FROM + (1 - LEVEL_INTRO_SCALE_FROM) * e;

  return { x, y, alpha: a, scale: s, shadow };
}

    function getOrderedLevelKeys(data) {
      const levelsObj = data?.levels;
      if (!levelsObj || typeof levelsObj !== "object") return [];
      const keys = Object.keys(levelsObj);

      function keyNum(k) {
        const m = (k + "").match(/(\d+)/);
        return m ? parseInt(m[1], 10) : Number.POSITIVE_INFINITY;
      }

      return keys.sort((a,b) => {
        const na = keyNum(a), nb = keyNum(b);
        if (na !== nb) return na - nb;
        return (a + "").localeCompare(b + "");
      });
    }

      if (!grid || !Array.isArray(grid)) return false;

      const yStart = gLevelDataCache?.meta?.yStart ?? G_BRICK_Y_START;

      bricks = [];
      for (let r = 0; r < grid.length; r++) {
        const row = grid[r];
        if (!row) continue;
        for (let c = 0; c < row.length; c++) {
          const t = row[c];
          if (t === -1 || t === null || t === undefined) continue;
          addBrick(r, c, t, yStart);
        }
      }
      return true;
    }

    async function runInitializationSequence() {
  if (initState.started) return;
  initState.started = true;
  initState.done = false;
  initState.ready = false;
  initState.t0 = performance.now();
  initState.progress = 0;
  setInitButtonVisible(false);
  setInitReady(false);
  setInitProgress(0.00);

  // NOTE: Audio must be unlocked by a user gesture. We do NOT start music during preload.

  // Preload critical assets + JSON (deterministic, cached)
  const tasks = [
    preloadImage('BrickShiftoutsSprites.png'),
    preloadImage('StartScreen.jpg'),
    preloadImage('GameOver.jpg'),
    preloadImage('EndScreen.jpg'),
    preloadImage('gBKG lv1.jpg'),
    preloadImage('gBKG lv3.jpg'),
    preloadVideo('V0.mp4'),
    preloadVideo('V1.mp4'),
    loadGLevelsJsonOnce(),
    loadMainLevelsJsonOnce(),
    loadAiLevelsJsonOnce()
  ];

  let done = 0;
  const total = tasks.length;
  const startTs = initState.t0;

  // Smooth rAF-driven progress:
  // - Time ramp guarantees at least ~2s of visible motion
  // - Task completion contributes the tail so it doesn't lie
  // - A gentle creep avoids the classic "stuck at 90%" vibe
  let rafId = 0;
  let p = 0;

  function tick() {
    if (initState.done) return;

    const now = performance.now();
    const elapsed = now - startTs;

    const timeFrac = Math.max(0, Math.min(1, elapsed / Math.max(1, initState.minMs))); // 0..1 over minMs
    const taskFrac = (total > 0) ? (done / total) : 1;

    // base target: mostly time-driven for smoothness, topped off by tasks
    let target = 0.02 + (timeFrac * 0.82 + taskFrac * 0.16) * 0.96;

    // After minMs, if tasks are still pending, creep slowly toward ~97% while waiting.
    if (elapsed > initState.minMs && taskFrac < 1) {
      const creep = Math.min(0.05, ((elapsed - initState.minMs) / 8000) * 0.05);
      target = Math.max(target, 0.92 + creep);
    }

    target = Math.min(0.998, Math.max(0, target));

    // Smoothly approach target
    p = p + (target - p) * 0.18;
    setInitProgress(p);

    rafId = requestAnimationFrame(tick);
  }

  // Count task completions
  tasks.forEach(t => {
    Promise.resolve(t)
      .then(() => { done++; })
      .catch(_ => { done++; });
  });

  requestAnimationFrame(tick);

  // Wait for tasks + minimum time
  try { await Promise.all(tasks.map(t => Promise.resolve(t).catch(_ => null))); } catch(e) {}
  const elapsed = performance.now() - startTs;
  const remaining = Math.max(0, initState.minMs - elapsed);
  if (remaining > 0) await new Promise(r => setTimeout(r, remaining));

  // Finish: animate to 100% quickly but smoothly, then show READY + button.
  const finishStart = performance.now();
  const finishDur = 220; // ms
  function finishTick() {
    const t = (performance.now() - finishStart) / finishDur;
    const u = Math.max(0, Math.min(1, t));
    const eased = u * (2 - u); // easeOutQuad
    const val = p + (1.0 - p) * eased;
    setInitProgress(val);
    if (u < 1) requestAnimationFrame(finishTick);
    else {
      initState.done = true;
      setInitProgress(1.0);
      setInitReady(true);
      cancelAnimationFrame(rafId);
    }
  }
  requestAnimationFrame(finishTick);
}

    function enableDragScroll(el) {
      let dragging = false;
      let startY = 0;
      let startScrollTop = 0;

      el.addEventListener('pointerdown', (e) => {
        dragging = true;
        startY = e.clientY;
        startScrollTop = el.scrollTop;
        try { el.setPointerCapture(e.pointerId); } catch(_){}
      });

      el.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const dy = e.clientY - startY;
        el.scrollTop = startScrollTop - dy;
      });

      function endDrag(e) {
        dragging = false;
        try { el.releasePointerCapture(e.pointerId); } catch(_){}
      }

      el.addEventListener('pointerup', endDrag);
      el.addEventListener('pointercancel', endDrag);
      el.addEventListener('pointerleave', () => { dragging = false; });
    }

    function updateBubblesGeneric(bubblesArr, dtSimLocal) {
      // time-based background bubbles (dtSimLocal is normalized to 60fps units)
      if (!bubblesArr) return;

      if (bubblesArr.length < 80) {
        const spawnChance = 0.2 * dtSimLocal; // preserve prior average rate at 60fps
        if (Math.random() < spawnChance) {
          bubblesArr.push({
            x: Math.random() * 720,
            y: 1300,
            r: (Math.random() * 3.25 + 2.6),
            speed: (Math.random() * 1.5 + 2),
            wobble: (Math.random() * 0.5)
          });
        }
      }

      for (let i = bubblesArr.length - 1; i >= 0; i--) {
        let b = bubblesArr[i];
        b.y -= b.speed * dtSimLocal;
        b.x += Math.sin(b.y / 100) * b.wobble * dtSimLocal;
        if (b.y < -50) bubblesArr.splice(i, 1);
      }
    }

    // Bounce helper: flips vertical direction but preserves overall speed magnitude by default.
    // Optionally applies a per-brick-type speed delta (can remain 0 for all types).
    function applyBrickBouncePreserveSpeed(brickType, vx, vy, bounceAxis = 'y') {
      // Speed behavior is controlled ONLY by BRICK_SPEED_DELTA.
      // With all deltas at 0, brick collisions will NOT change ball speed (only direction).
      const d = (BRICK_SPEED_DELTA[brickType] ?? 0);

      // Neutral path (default): exact sign-flip, no renormalization drift.
      if (d === 0) {
        if (bounceAxis === 'x') return { vx: -vx, vy: vy };
        return { vx: vx, vy: -vy };
      }

      // Optional future behavior: preserve current magnitude, then apply a delta.
      const speed = Math.hypot(vx, vy) || 0.0001;

      let nvx = vx, nvy = vy;
      if (bounceAxis === 'x') nvx = -nvx;
      else nvy = -nvy;

      // Renormalize to preserve magnitude before applying delta
      const newMag = Math.hypot(nvx, nvy) || 1;
      nvx = (nvx / newMag) * speed;
      nvy = (nvy / newMag) * speed;

      const target = Math.max(0.1, speed + d);
      nvx = (nvx / speed) * target;
      nvy = (nvy / speed) * target;

      return { vx: nvx, vy: nvy };
    }


    function addBrick(r, c, t, yStart = 150) {

      const base = typeBasePulse[t] ?? 0.055;

      const speedJitter = 0.55 + Math.random() * 1.25;
      const drift = (Math.random() - 0.5) * 0.006;

      bricks.push({
        row:r, col:c,
        x: xOff+(c*90),
        y: yStart+(r*24),
        baseX: xOff+(c*90),
        baseY: yStart+(r*24),
        isSpawning:false, spawn:null,
        w:90, h:24,
        state:'normal', type:t,
        animFrame:0, animTicks:0, breakT:0,
        pulseOffset:Math.random()*Math.PI*2,
        pulseSpeed:base * speedJitter,
        pulseDrift:drift
      });
    }

function launchBallFromDock(flickDX = 0, flickDY = -1) {
  // Upward flick launch with direction influence (clamped + damped)
  ball.state = "launched";
  ball.active = true;

  

  resetTrailToBall();
launchCueT = 0;
  // If the player launches instantly, cancel the spawn cue.
  ballSpawnFx.active = false;
  ballRenderAlpha = 1.0;

  // Base speed (keep consistent; we only steer angle)
  const speed = LAUNCH_SPEED;

  // Compute intended angle from flick, relative to straight-up.
  // Screen coords: up is negative DY. We want angle where 0 = straight up.
  let ang = 0;
  const mag = Math.hypot(flickDX, flickDY);
  if (mag > 0.001) {
    // angle from vertical: atan2(dx, -dy)
    ang = Math.atan2(flickDX, -flickDY);
  }

  // Dampen toward straight-up to forgive finger slop
  ang *= FLICK_ANGLE_DAMP;

  // Clamp to tolerance
  const maxA = (FLICK_MAX_ANGLE_DEG * Math.PI) / 180;
  if (ang > maxA) ang = maxA;
  if (ang < -maxA) ang = -maxA;

  // Convert back to velocity
  const vx = Math.sin(ang) * speed;
  const vy = -Math.cos(ang) * speed;

  // Small paddle influence stays (but subtle)
  const paddleInfluence = Math.max(-6, Math.min(6, paddle.vx || 0));
  ball.vx = vx + (paddleInfluence * 0.12);
  ball.vy = vy;
}

    function loop(timestamp) {
      // Guard against undefined/invalid RAF timestamp (prevents NaN dt on manual loop() calls).
      if (!Number.isFinite(timestamp)) {
        requestAnimationFrame(loop);
        return;
      }

      // Delta-time (seconds), clamped for stability on mobile throttling / tab stalls.
      if (!lastFrameTs) lastFrameTs = timestamp;
      const rawDt = (timestamp - lastFrameTs) / 1000;
      lastFrameTs = timestamp;
      dtSec = Math.min(Math.max(rawDt, 0), 0.05); // clamp to <= 50ms
      dtNorm = dtSec * 60; // normalize to the old 60fps frame-based tuning
      dtSim = dtNorm * ENGINE_TIME_SCALE;

      update(); draw(); frames++;
      if (timestamp > lastTime + 1000) { fps = Math.round((frames * 1000) / (timestamp - lastTime)); lastTime = timestamp; frames = 0; }
      loopId = requestAnimationFrame(loop);
    }

    function update() {
      if (isVideoPlaying) return;

      // Engine pre-pass (always-on ambience)
      updateMenuBubbles();
      if (currentLevel !== 0) updateGameBubbles();
      updateScubaPurge();

      // Gameplay update only runs during active play
      if (!isRunning || currentLevel === 0) return;

      

      // Launch cue animation clock (only while ball is docked)
      if (ball && ball.state === "docked") launchCueT += dtSim;
// Game-over delay (sit with failure)
      if (gameOverPending) {
        updatePaddleKinematics();
        updateShockwave();
        updateDeathWave();
        updateParticles();
        gameOverDelayTimer -= dtSim; if (gameOverDelayTimer <= 0) { gameOverPending = false; triggerGameOver(false); }
        return;
      }

      updatePaddleKinematics();
      updateShockwave();
      updateDeathWave();
      updateBricksAnim();
      updateParticles();

      // Level intro: bricks animate in before any gameplay (ball spawn/collisions gated).
      if (gamePhase === 'INTRO') {
        updateLevelIntroAnimation();
        return;
      }

      // Normal play
      updateBallDeath();
      updateBallSpawnFx();
      updateBallAndCollisions();
    }

    function updatePaddleKinematics() {
      // Arrow-key paddle movement. This runs alongside touch/mouse movement; the
      // latest input simply determines the paddle position for that frame.
      if (isRunning && currentLevel > 0 && !isVideoPlaying) {
        let keyDir = 0;
        if (keyboardLeftDown) keyDir -= 1;
        if (keyboardRightDown) keyDir += 1;
        if (keyDir !== 0) {
          paddle.x += keyDir * KEYBOARD_PADDLE_SPEED * dtNorm;
          paddle.x = Math.max(0, Math.min(720 - paddle.w, paddle.x));
        }
      }

      paddle.vx = (paddle.x - paddle.lastX) / Math.max(0.001, dtNorm);
      paddle.lastX = paddle.x;
    }

    function updateShockwave() {
      if (!shockwave.active) return;

      shockwave.r += 16 * dtSim; // 2x speed (100% quicker)
      if (shockwave.r > shockwave.maxR) {
        shockwave.active = false;
        if (pendingWinEndAfterShockwave) {
          pendingWinEndAfterShockwave = false;
          // Final-level win: fade to black (1s), then show EndGame, then fade back out.
          fadeToBlackThen(() => { triggerGameOver(true); }, 1000);
        }
      }

      bricks.forEach(b => {
        if (b.state !== 'normal') return;
        let dx = (b.x + 45) - shockwave.x, dy = (b.y + 12) - shockwave.y;
        if (Math.sqrt(dx*dx + dy*dy) < shockwave.r) {
          if (b.type === 4) return; b.state = 'breaking'; b.animFrame = 1; b.breakT = 0; score += BRICK_POINTS[b.type];
          createDebris(b.x + 45, b.y + 12); playSfx('brick');
        }
      });
    }

    function updateDeathWave() {
      if (!deathWave.active) return;
      deathWave.age += dtSim;
      const t = Math.min(1, deathWave.age / Math.max(1, deathWave.life));
      deathWave.r = deathWave.maxR * t;
      if (deathWave.age >= deathWave.life) {
        deathWave.active = false;
      }
    }

    function triggerBallDeath() {
      if (ball.state === "dying") return;
      ball.state = "dying";
      ball.active = false;

      // benchmark FX: a single ring + a debris pop
      deathWave.active = true;
      deathWave.x = ball.x;
      deathWave.y = Math.min(1275, Math.max(0, ball.y));
      deathWave.r = 0; deathWave.age = 0;

      ballDeathTimer = 45; // ~0.75s at 60fps
      createDeathDebris(ball.x, deathWave.y);
    }

    function finalizeBallDeath() {
      ballDeathTimer = 0;
      lives--;

      if (lives <= 0) {
        // Sit with the failure for a beat before showing Game Over.
        ball.state = "dead";
        gameOverPending = true;
        gameOverDelayTimer = 120; // 2s @ 60fps
        return;
      }

      // Respawn a new ball docked to wherever the paddle currently is.
      dockBallToPaddle();
    }

    function updateBallDeath() {
      if (ball.state !== "dying") return;
      ballDeathTimer -= dtSim;
      if (ballDeathTimer <= 0) finalizeBallDeath();
    }


    function updateBricksAnim() {
      for (let i = bricks.length - 1; i >= 0; i--) {
        const b = bricks[i];
        if (b.animTicks === undefined) b.animTicks = 0;
        b.animTicks += dtSim;

        if (b.pulseDrift) b.pulseSpeed = Math.max(0.01, b.pulseSpeed + (b.pulseDrift * 0.001 * dtSim));

        if (b.state === 'breaking') {
          if (b.breakT === undefined) b.breakT = 0;
          b.breakT += dtSim; // dtSim is normalized to 60fps frames (with ENGINE_TIME_SCALE)

          // 2-frame break animation over 1 second total:
          // 0.0–0.5s -> frame 1, 0.5–1.0s -> frame 2, then remove
          if (b.breakT < 6) {
            b.animFrame = 1;
          } else if (b.breakT < 12) {
            b.animFrame = 2;
          } else {
            bricks.splice(i, 1);
            continue;
          }
        }
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dtSim; p.y += p.vy * dtSim;
        if (p.wobble) { p.x += Math.sin((p.y * 0.06) + (p.phase || 0)) * p.wobble * dtSim; }
        const drag = (p.drag === undefined) ? 0.94 : p.drag;
        p.vx *= Math.pow(drag, dtSim); p.vy *= Math.pow(drag, dtSim);
        const ay = (p.ay === undefined) ? 0.075 : p.ay;
        p.vy -= ay * dtSim;
        p.life -= 0.01 * dtSim;
        if (p.life <= 0) particles.splice(i, 1);
      }
      updateBallTrail();
    }

    function updateBallAndCollisions() {
      // If docked, stick to paddle and wait for flick launch.
      if (ball.state === "docked") { ball.x = paddle.x + (paddle.w / 2); ball.y = paddle.y - BALL_DOCK_Y_OFF; return; }
      if (!ball.active) { ballWasActive = false; trailLastX = ball.x; trailLastY = ball.y; return; }

      // If the ball just became active this frame, reset trail anchors to avoid a 'teleport catch-up' streak.
      if (!ballWasActive) {
        ballWasActive = true;
        // lock render history so the ball never "ghosts" on activation/spawn
        ball.px = ball.x;
        ball.py = ball.y;
        trailLastX = ball.x;
        trailLastY = ball.y;
        ballTrail.length = 0;
      }

      // trail (emit only while ball is active; existing trail fades out independently)
      // distance-based emission to avoid undersampling at high speed
      const dxT = ball.x - trailLastX;
      const dyT = ball.y - trailLastY;
      const distT = Math.hypot(dxT, dyT);

      if (!isFinite(distT) || distT < 0.001) {
        // nothing
      } else {
        const step = TRAIL_SPACING_PX;
        const emits = Math.min(TRAIL_MAX_EMITS_PER_FRAME, Math.floor(distT / step));
        if (emits > 0) {
          const inv = 1 / distT;
          const ux = dxT * inv, uy = dyT * inv;
          for (let k = 1; k <= emits; k++) {
            const ex = trailLastX + ux * step * k;
            const ey = trailLastY + uy * step * k;
            ballTrail.push({ x: ex, y: ey, life: 1.0 });
          }
          // advance the last emission anchor by the emitted distance
          trailLastX += ux * step * emits;
          trailLastY += uy * step * emits;
        }
        // if we didn't emit (dist < step), keep last anchor to accumulate distance next frame
      }

      // cap points
      while (ballTrail.length > TRAIL_MAX_POINTS) ballTrail.shift();

      // integrate
      ball.px = ball.x; ball.py = ball.y;
      ball.x += ball.vx * dtNorm; ball.y += ball.vy * dtNorm;

      // walls (anti-vertical reject WITHOUT changing overall speed)
      if (ball.x < 15 || ball.x > 705) {
        const speed = Math.hypot(ball.vx, ball.vy) || 0;
        const wantLeft = (ball.x < 15);
        const signX = wantLeft ? 1 : -1;

        // reflect
        let vx = signX * Math.abs(ball.vx);

        // small wiggle to avoid repeating perfectly vertical cycles (speed-neutral)
        vx += signX * ((Math.random() * 2 - 1) * WALL_VX_WIGGLE);

        // enforce a minimum horizontal component, but never exceed available speed
        const minVx = Math.min(WALL_MIN_VX_AFTER_BOUNCE, speed * 0.55);
        const maxVx = Math.max(minVx, speed * 0.95);
        const absVx = Math.min(maxVx, Math.max(minVx, Math.abs(vx)));
        vx = signX * absVx;

        // recompute vy to preserve speed magnitude
        const vySign = (ball.vy === 0) ? -1 : Math.sign(ball.vy);
        let vySq = (speed * speed) - (vx * vx);
        if (vySq < 0.01) vySq = 0.01;
        const vy = vySign * Math.sqrt(vySq);

        ball.vx = vx;
        ball.vy = vy;
        ball.x = wantLeft ? 16 : 704;
      }

      // ceiling -> shockwave / level advance
      if (ball.y < -5) {
        shockwave.active = true; shockwave.x = ball.x; shockwave.y = 0; shockwave.r = 0; ball.active = false;
        if (!scubaPurge.active) startScubaPurge();

        if (currentLevel > 10) {
          triggerGameOver(true);
        } else {
          const maxLv = getMaxLevelsForCurrentMode();
          if (currentLevel < maxLv) {
            transitionToVideo(false, false);
          } else {
            // Final level cleared. A.I. GEN gets the outro animation first, then YOU WIN.
            if (isGeminiMode) {
              pendingGeminiWinAfterOutro = true;
              transitionToVideo(false, false);
            } else {
              // Standard mode: let the clear-shockwave finish before showing EndGame.
              if (!scubaPurge.active) startScubaPurge();
              pendingWinEndAfterShockwave = true;
            }
          }
        }
        return;
      }

      // bottom -> lose life (death FX pipeline)
      if (ball.y > 1280) {
        triggerBallDeath();
        return;
      }

      // paddle (swept collision + ball-radius padding)
      // The old test waited for the ball center to enter the paddle rectangle.
      // At high speed that could let the ball tunnel through the paddle.
      const BALL_RADIUS = 16;
      const paddleTop = paddle.y - BALL_RADIUS;
      const paddleLeft = paddle.x - BALL_RADIUS;
      const paddleRight = paddle.x + paddle.w + BALL_RADIUS;
      const crossedPaddleTop =
        ball.vy > 0 &&
        ball.py <= paddleTop &&
        ball.y >= paddleTop;
      const alreadyOverlappingPaddle =
        ball.vy > 0 &&
        ball.y >= paddleTop &&
        ball.y <= paddle.y + paddle.h + BALL_RADIUS;

      if ((crossedPaddleTop || alreadyOverlappingPaddle) &&
          ball.x >= paddleLeft && ball.x <= paddleRight) {
        // Snap the ball to the safe contact plane before reflecting it.
        // This prevents penetration and also guarantees it cannot emerge below
        // the paddle on the next frame.
        ball.y = paddleTop;

        playSfx('paddle');

        const curSpeed = Math.hypot(ball.vx, ball.vy) || 0;
        const targetSpeed = Math.max(0.1, curSpeed + (PADDLE_SPEED_DELTA || 0));

        // Use the actual contact point, clamped to the paddle itself.
        const contactX = Math.max(paddle.x, Math.min(paddle.x + paddle.w, ball.x));
        const paddleCenter = paddle.x + (paddle.w * 0.5);
        const nx = (contactX - paddleCenter) / (paddle.w * 0.5);

        // desired horizontal component (controls angle), NOT speed
        let vx = (nx * 10) + (paddle.vx * 0.4);

        // clamp vx so vy stays real, then compute vy to preserve magnitude
        const maxAbsVx = Math.max(0.01, targetSpeed * 0.95);
        vx = Math.max(-maxAbsVx, Math.min(maxAbsVx, vx));

        let vySq = (targetSpeed * targetSpeed) - (vx * vx);
        if (vySq < 0.01) vySq = 0.01;
        const vy = -Math.sqrt(vySq);

        ball.vx = vx;
        ball.vy = vy;
      }

      // === BRICK COLLISION BEHAVIOR PATCH ===
      // Use swept ball/brick collision instead of testing only whether the ball
      // center is inside an expanded rectangle. This prevents the ball from
      // entering shared seams between adjacent bricks and getting repeatedly
      // reflected by indestructible bricks.
      //
      // B5 (type 4): solid, indestructible, normal bounce
      // B4 (type 3): explodes and remains pass-through (no reflection)

      function sweptPointAabb(x0, y0, x1, y1, left, top, right, bottom) {
        const dx = x1 - x0;
        const dy = y1 - y0;

        const inside = (x0 >= left && x0 <= right && y0 >= top && y0 <= bottom);

        // If the ball center already starts inside the swept bounds, resolve it
        // immediately by choosing the boundary most opposed to current motion.
        if (inside) {
          const candidates = [
            { d: Math.abs(x0 - left),  nx: -1, ny: 0 },
            { d: Math.abs(right - x0), nx:  1, ny: 0 },
            { d: Math.abs(y0 - top),   nx: 0, ny: -1 },
            { d: Math.abs(bottom - y0),nx: 0, ny:  1 }
          ];

          candidates.sort((a, b) => {
            const ad = (dx * a.nx + dy * a.ny);
            const bd = (dx * b.nx + dy * b.ny);
            // Prefer a boundary the ball is actually moving into; then use
            // smallest penetration as the deterministic tie-breaker.
            const ap = ad < 0 ? 0 : 1;
            const bp = bd < 0 ? 0 : 1;
            if (ap !== bp) return ap - bp;
            return a.d - b.d;
          });

          const n = candidates[0];
          return { t: 0, nx: n.nx, ny: n.ny };
        }

        let tEnter = 0;
        let tExit = 1;
        let enterNx = 0;
        let enterNy = 0;

        if (Math.abs(dx) < 1e-9) {
          if (x0 < left || x0 > right) return null;
        } else {
          const tx1 = (left - x0) / dx;
          const tx2 = (right - x0) / dx;
          const txEnter = Math.min(tx1, tx2);
          const txExit  = Math.max(tx1, tx2);
          if (txEnter > tEnter) {
            tEnter = txEnter;
            enterNx = dx > 0 ? -1 : 1;
            enterNy = 0;
          }
          tExit = Math.min(tExit, txExit);
          if (tEnter > tExit) return null;
        }

        if (Math.abs(dy) < 1e-9) {
          if (y0 < top || y0 > bottom) return null;
        } else {
          const ty1 = (top - y0) / dy;
          const ty2 = (bottom - y0) / dy;
          const tyEnter = Math.min(ty1, ty2);
          const tyExit  = Math.max(ty1, ty2);
          if (tyEnter > tEnter) {
            tEnter = tyEnter;
            enterNx = 0;
            enterNy = dy > 0 ? -1 : 1;
          }
          tExit = Math.min(tExit, tyExit);
          if (tEnter > tExit) return null;
        }

        if (tEnter < 0 || tEnter > 1) return null;
        return { t: tEnter, nx: enterNx, ny: enterNy };
      }

      const BRICK_BALL_RADIUS = 16;
      const brickHits = [];
      const startX = ball.px;
      const startY = ball.py;
      const endX = ball.x;
      const endY = ball.y;

      bricks.forEach((b, idx) => {
        if (b.state !== 'normal') return;

        // Minkowski-expanded rectangle: brick rect + ball radius + a tiny skin.
        const pad = BRICK_BALL_RADIUS + BRICK_COLLISION_PAD;
        const hit = sweptPointAabb(
          startX, startY, endX, endY,
          b.x - pad, b.y - pad,
          b.x + b.w + pad, b.y + b.h + pad
        );
        if (!hit) return;

        brickHits.push({ b, idx, ...hit });
      });

      brickHits.sort((a, b) => {
        const dt = a.t - b.t;
        if (Math.abs(dt) > 0.00001) return dt;

        // At a shared seam, choose the surface that most directly opposes
        // the incoming velocity. This avoids bouncing alternately between
        // the two neighboring bricks.
        const av = endX - startX, aw = endY - startY;
        const aApproach = av * a.nx + aw * a.ny;
        const bApproach = av * b.nx + aw * b.ny;
        return aApproach - bApproach;
      });

      let solidHandled = false;
      for (const hit of brickHits) {
        const b = hit.b;

        // Ignore solid hits after the first solid collision in this frame.
        // Pass-through bricks may still be destroyed before that collision.
        if (solidHandled) break;

        if (b.type === 3) {
          // B4: explode, NO slowdown, NO reflection (pass-through).
          b.state = 'breaking'; b.animFrame = 1; b.breakT = 0; score += BRICK_POINTS[b.type];
          createDebris(b.x + 45, b.y + 12);
          playSfx('brick');
          continue;
        }

        // Reconstruct the actual circle-vs-rectangle contact from the swept
        // hit. The closest point on the real brick gives us a true face/corner
        // normal, while the final position places the ball just outside the
        // brick. This is what prevents a corner hit from entering a shared seam.
        const dx = endX - startX;
        const dy = endY - startY;
        const contactT = Math.max(0, Math.min(1, hit.t));
        const contactX = startX + dx * contactT;
        const contactY = startY + dy * contactT;

        const closestX = Math.max(b.x, Math.min(b.x + b.w, contactX));
        const closestY = Math.max(b.y, Math.min(b.y + b.h, contactY));
        let nx = contactX - closestX;
        let ny = contactY - closestY;
        const nLen = Math.hypot(nx, ny);

        if (nLen > 1e-6) {
          nx /= nLen;
          ny /= nLen;
        } else {
          // Fallback for a numerically exact edge/inside case.
          nx = hit.nx;
          ny = hit.ny;
        }

        const CONTACT_EPS = 0.75;
        const safeCenterDist = BRICK_BALL_RADIUS + CONTACT_EPS;
        ball.x = closestX + nx * safeCenterDist;
        ball.y = closestY + ny * safeCenterDist;
        ball.px = ball.x;
        ball.py = ball.y;

        // Reflect against the actual face/corner normal. Reflection across a
        // unit normal preserves the ball's speed and handles side + corner hits
        // without assuming every brick collision is a vertical bounce.
        const vn = (ball.vx * nx) + (ball.vy * ny);
        if (vn < 0) {
          let rvx = ball.vx - (2 * vn * nx);
          let rvy = ball.vy - (2 * vn * ny);

          // Preserve the existing optional per-brick speed-delta hook.
          const speedDelta = (BRICK_SPEED_DELTA[b.type] ?? 0);
          if (speedDelta !== 0) {
            const speed = Math.hypot(rvx, rvy) || 0.0001;
            const target = Math.max(0.1, speed + speedDelta);
            rvx = (rvx / speed) * target;
            rvy = (rvy / speed) * target;
          }

          ball.vx = rvx;
          ball.vy = rvy;
        } else {
          // Defensive: if already separating, push velocity away from the
          // contact normal rather than allowing it to remain trapped.
          const speed = Math.hypot(ball.vx, ball.vy) || 0.1;
          let rvx = ball.vx;
          let rvy = ball.vy;
          const away = (rvx * nx) + (rvy * ny);
          if (away <= 0) {
            rvx -= 2 * away * nx;
            rvy -= 2 * away * ny;
          }
          const mag = Math.hypot(rvx, rvy) || 1;
          ball.vx = (rvx / mag) * speed;
          ball.vy = (rvy / mag) * speed;
        }

        if (b.type === 4) {
          // B5: indestructible obstacle: normal bounce only (no break, no score).
          playSfx('brick');
        }
        else if (b.type === 2) {
          // Armor: bounce, degrade to type 0.
          b.type = 0;
          playSfx('paddle');
        }
        else {
          // Types 0/1: bounce + explode.
          b.state = 'breaking'; b.animFrame = 1; b.breakT = 0; score += BRICK_POINTS[b.type];
          createDebris(b.x + 45, b.y + 12);
          playSfx('brick');
        }

        solidHandled = true;
      }
    }

    function draw() {
      if (!ctx) return;
      ctx.clearRect(0, 0, 720, 1280);
if (currentLevel === 0) {
        drawStartScreen();
      }

      // Keep menu bubbles animating on the GameOver/End screen overlay.
      drawEndScreenBubbles();

      if (assetsLoaded && currentLevel > 0) {
        drawGameplay();
      }

      // Do not flash PAUSED during End/GameOver transitions.
      const endEl = document.getElementById('end-screen');
      if (!isRunning && currentLevel > 0 && !isVideoPlaying && !(endEl && isVisible(endEl))) {
        drawPauseOverlay();
      }

      // Top-layer one-shot FX (over UI)
      drawScubaPurge();
    }

    // === SCUBA PURGE FX (top-layer) ===
    function startScubaPurge() {
      if (!fxTopCtx) return;
      scubaPurge.active = true;
      scubaPurge.t = 0;
      scubaPurge.emitAcc = 0;
      scubaPurge.parts = [];
      // big initial blast: pre-seed a chunk so it shows up immediately
      const seedN = 72;
      for (let i = 0; i < seedN; i++) {
        spawnScubaBubble(true);
      }
    }

    function spawnScubaBubble(isBlast) {
      if (!fxTopCtx) return;

      // Spawn from a *wide* emitter below screen so the burst fills the full width (and beyond).
      const spread = isBlast ? 620 : 520; // wider than 720px canvas
      const x0 = 360 + (Math.random() * 2 - 1) * spread;
      const y0 = 1280 + (Math.random() * 2 - 1) * (isBlast ? 26 : 14);

      // Size variety: many small, some huge.
      const u = Math.random();
      const rMin = isBlast ? 10 : 8;
      const rMax = isBlast ? 78 : 54;
      const r0 = rMin + (rMax - rMin) * Math.pow(u, 0.55);

      // Fast injection upward; lateral chaos is mostly wobble, not raw vx.
      const vx = (Math.random() * 2 - 1) * (isBlast ? 3.2 : 2.4);
      const vy = -(isBlast ? (18 + Math.random() * 24) : (13 + Math.random() * 18));

      // Let most bubbles clear the top before they fade out.
      const life = isBlast ? (120 + Math.random() * 90) : (95 + Math.random() * 85); // dtSim units

      // Crazy underwater wobble (amplitude scales with size).
      const wobAmp = (0.14 * r0) + (isBlast ? 6 : 4);   // px-ish in our units
      const wobSpd = 0.22 + Math.random() * 0.48;

      scubaPurge.parts.push({
        x: x0, y: y0, vx, vy,
        r: r0,
        age: 0,
        life: life,
        wob: Math.random() * Math.PI * 2,
        wobSpd: wobSpd,
        wobAmp: wobAmp,
        wobAmp2: wobAmp * (0.55 + Math.random() * 0.35),
        wobPh2: Math.random() * Math.PI * 2
      });
    }

    function updateScubaPurge() {
      if (!scubaPurge.active) return;

      scubaPurge.t += dtSim;

      // Emission profile: violent burst -> taper -> trailers -> stop
      if (scubaPurge.t <= scubaPurge.emitDur) {
        const u = scubaPurge.t / scubaPurge.emitDur; // 0..1
        const rate = (22 * (1 - u)) + (5.0 * u); // per frame unit
        scubaPurge.emitAcc += rate * (dtSim / 1);
        const maxSpawn = 40;
        let spawned = 0;
        while (scubaPurge.emitAcc >= 1 && spawned < maxSpawn) {
          spawnScubaBubble(true);
          scubaPurge.emitAcc -= 1;
          spawned++;
        }
      } else if (scubaPurge.t <= scubaPurge.dur) {
        // sparse trailing bubbles
        if (Math.random() < 0.28 * (dtSim / 1)) spawnScubaBubble(false);
      }

      // Update particles
      const drag = Math.pow(0.992, dtSim);
      for (let i = scubaPurge.parts.length - 1; i >= 0; i--) {
        const p = scubaPurge.parts[i];
        p.age += dtSim;

        // wobble / drift (big, chaotic, underwater)
        p.wob += p.wobSpd * dtSim;

        const amp1 = (p.wobAmp || 8);
        const amp2 = (p.wobAmp2 || (amp1 * 0.7));
        const ph2  = (p.wobPh2 || 0);

        // Multi-frequency lateral wobble (dominant), plus a little vertical bob.
        const wobX = (Math.sin(p.wob) * amp1) + (Math.cos(p.wob * 1.73 + ph2) * amp2);
        const wobY = (Math.sin(p.wob * 0.92 + ph2) * (amp2 * 0.18));

        p.x += (p.vx * dtSim) + (wobX * 0.22);
        p.y += (p.vy * dtSim) + (wobY * 0.22);

        // buoyancy + drag
        p.vy -= 0.060 * dtSim; // accelerates upward (buoyancy)
        p.vx *= drag;
        p.vy *= drag;

        // subtle expansion
        p.r += 0.06 * dtSim;

        if (p.age >= p.life || p.y + p.r < -40) {
          scubaPurge.parts.splice(i, 1);
        }
      }

      // Kill system once time is up AND all bubbles are gone.
      if (scubaPurge.t > scubaPurge.dur && scubaPurge.parts.length === 0) {
        scubaPurge.active = false;
      }
    }

    function drawScubaPurge() {
      if (!fxTopCtx || !fxTopCanvas) return;
      fxTopCtx.clearRect(0, 0, 720, 1280);
      if (!scubaPurge.active) return;

      for (let i = 0; i < scubaPurge.parts.length; i++) {
        const p = scubaPurge.parts[i];
        const a = 1 - (p.age / p.life);
        const alpha = Math.max(0, Math.min(1, a));

        // filled bubble body (white @ 50% peak, fades with life)
        fxTopCtx.beginPath();
        fxTopCtx.fillStyle = "rgba(195, 204, 206," + (0.25 * alpha).toFixed(4) + ")";
        fxTopCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        fxTopCtx.fill();

        // subtle outer edge (keeps it readable over UI)
        fxTopCtx.beginPath();
        fxTopCtx.lineWidth = 1.5;
        fxTopCtx.strokeStyle = "rgba(195, 204, 206," + (0.09 * alpha).toFixed(4) + ")";
        fxTopCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        fxTopCtx.stroke();

        // inner spec
        fxTopCtx.beginPath();
        fxTopCtx.fillStyle = "rgba(21, 23, 24," + (0.08 * alpha).toFixed(4) + ")";
        fxTopCtx.arc(p.x - p.r * 0.24, p.y - p.r * 0.28, Math.max(1, p.r * 0.18), 0, Math.PI * 2);
        fxTopCtx.fill();
}
    }

    function drawLaunchCue() {

      // Parented to the paddle via the docked ball position.
      if (!ball || ball.state !== "docked") return;

      const ox = ball.x;
      const oy = ball.y;

      const amp = (LAUNCH_CUE_WAG_AMP_DEG * Math.PI) / 180;
      const base = -Math.PI / 2; // straight up
      const ang = base; // fixed straight up (decoupled from waggle)

      const dx = Math.cos(ang), dy = Math.sin(ang);
      const len = LAUNCH_CUE_LEN;

      const x2 = ox + dx * len;
      const y2 = oy + dy * len;

      ctx.save();
      ctx.lineCap = "round";

      // Trajectory field V-shape indicating possible launch angles
      const spreadDeg = 75; // total V opening angle
      const spread = (spreadDeg * Math.PI) / 180;
      const half = spread * 0.5;

      const vLen = Math.max(48, Math.min(120, LAUNCH_CUE_LEN * 0.85));
      const aL = -Math.PI / 2 - half;
      const aR = -Math.PI / 2 + half;

      const lx = ox + Math.cos(aL) * vLen, ly = oy + Math.sin(aL) * vLen;
      const rx = ox + Math.cos(aR) * vLen, ry = oy + Math.sin(aR) * vLen;

// Left arm gradient
      let gg = ctx.createLinearGradient(ox, oy, lx, ly);
      gg.addColorStop(0.0, "rgba(195, 204, 206, 0.30)");
      gg.addColorStop(0.75, "rgba(195, 204, 206, 0.12)");
      gg.addColorStop(1.0, "rgba(195, 204, 206, 0.0)");
      ctx.strokeStyle = gg;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(ox, oy);
      ctx.lineTo(lx, ly);
      ctx.stroke();

// Right arm gradient (mirror)
      gg = ctx.createLinearGradient(ox, oy, rx, ry);
      gg.addColorStop(0.0, "rgba(195, 204, 206, 0.30)");
      gg.addColorStop(0.75, "rgba(195, 204, 206, 0.12)");
      gg.addColorStop(1.0, "rgba(195, 204, 206, 0.0)");
      ctx.strokeStyle = gg;
      ctx.beginPath();
      ctx.moveTo(ox, oy);
      ctx.lineTo(rx, ry);
      ctx.stroke();

// Arc pulses traveling up the waggle line (subtle "launch me" motion)
      const travel = len * 0.55; // shorter travel (stays near the paddle)
      const pulseCount = 3;
      const speed = 0.012; // even slower pulse drift

      for (let i = 0; i < pulseCount; i++) {
        // punchier arcs
        ctx.save();
        ctx.shadowBlur = 10;
        ctx.shadowColor = "rgba(255,255,255,0.35)";
        const p = (launchCueT * speed + i / pulseCount) % 1; // 0..1 along travel
        const cx = ox;
        const cy = oy - (p * travel); // radiate straight up within the V

        // Fade out as it moves away; mild breathing so it doesn't feel dead.
        const fade = (1 - p);
        const breathe = 0.82 + 0.18 * Math.sin(launchCueT * 1.2 + i * 1.7);

        const a = 0.425 * fade * breathe; // 50% less overall opacity
        const dist = (p * travel);
        const desiredX = dist * Math.tan(half); // half-width of the V at this height

        // Keep a readable Y radius, then scale X so arc ends meet the V boundaries.
        const rY = Math.max(14, 10 + dist * 0.22);
        const sx = Math.max(1.0, Math.min(8.0, 1.65 * (desiredX * Math.SQRT2) / Math.max(1e-3, rY))); // final big stretch to reach V

        const startA = -Math.PI / 2 - Math.PI / 4; // 90° arc centered on vertical
        const endA   = -Math.PI / 2 + Math.PI / 4;

        ctx.lineWidth = 2.4;

// Feathered arc ends: draw in short segments with alpha taper at start/end.
        const segs = 14;
        const feather = 0.18; // portion of the arc near each end that tapers
        const span = (endA - startA);
        const smoothstep = (x) => {
          x = Math.max(0, Math.min(1, x));
          return x * x * (3 - 2 * x);
        };

        for (let s = 0; s < segs; s++) {
          const t0 = s / segs;
          const t1 = (s + 1) / segs;
          const tm = (t0 + t1) * 0.5;

          // Taper to transparent at the ends
          const f0 = smoothstep(tm / feather);
          const f1 = smoothstep((1 - tm) / feather);
          const endFade = f0 * f1;

          const aa = a * endFade;
          if (aa <= 0.0001) continue;

          ctx.strokeStyle = `rgba(255, 255, 255, ${aa.toFixed(4)})`;
          
          ctx.save();
          ctx.translate(cx, cy);
          ctx.scale(sx, 1);
          // compensate stroke thickness so it doesn't balloon with scaling
          const lw = ctx.lineWidth; ctx.lineWidth = lw / sx;
          ctx.beginPath();
          ctx.arc(0, 0, rY, startA + span * t0, startA + span * t1);
          ctx.stroke();
          ctx.lineWidth = lw;
          ctx.restore();
}
        ctx.restore();
       }
      ctx.restore();
    }



    function drawGameplay() {
      if (globalBkg.complete) ctx.drawImage(globalBkg, 0, 0, 720, 1280);

      // side tick marks
      ctx.lineWidth = 1; ctx.strokeStyle = "rgba(117, 125, 128, 0.5)";
      for (let i = 0, c = 0; i <= 1280; i += 20, c++) {
        let l = 15; if (c % 10 === 0) l = 31; else if (c % 5 === 0) l = 23;
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(l, i); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(720, i); ctx.lineTo(720 - l, i); ctx.stroke();
      }

      // HUD bar
      ctx.fillStyle = "rgba(10, 12, 13, 0.75)";
      ctx.fillRect(0, 0, 720, HUD_BAR_H);

      // bubbles
      gameBubbles.forEach(b => {
        let sM = (b.y < 256) ? Math.max(0, b.y / 256) : 1.0;
        ctx.fillStyle = `rgba(195, 204, 206, 0.1)`;
        ctx.beginPath(); ctx.arc(b.x, b.y, Math.max(0.1, b.r * sM), 0, Math.PI * 2); ctx.fill();
      });

      // shockwave
      if (shockwave.active) {
        let sA = 0.45;
        let alpha = (shockwave.r > 600) ? sA * (1 - (shockwave.r - 600) / 600) : sA;
        ctx.save();
        ctx.shadowBlur = 15; ctx.shadowColor = "white";
        ctx.strokeStyle = `rgba(255, 255, 255, ${Math.max(0, alpha)})`;
        ctx.lineWidth = 8;
        ctx.beginPath(); ctx.arc(shockwave.x, shockwave.y, shockwave.r, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }

      // death wave (visual only)
      if (deathWave.active) {
        const dA = 0.2625;
        const fadeStart = deathWave.maxR * 0.60;
        const fadeRange = Math.max(1, deathWave.maxR - fadeStart);
        const dalpha = (deathWave.r > fadeStart) ? dA * (1 - (deathWave.r - fadeStart) / fadeRange) : dA;

        ctx.save();
        ctx.shadowBlur = 12; ctx.shadowColor = "white";

        // fill: radial gradient (black 0% at origin -> white ~30% near edge)
        const g = ctx.createRadialGradient(deathWave.x, deathWave.y, 0, deathWave.x, deathWave.y, Math.max(1, deathWave.r));
        const fillScale = Math.max(0, Math.min(1, dalpha / dA));
        const edgeA = 0.45 * fillScale;
        // push most of the gradation toward the edge
        g.addColorStop(0.00, `rgba(0, 0, 0, 0)`);
        g.addColorStop(0.86, `rgba(0, 0, 0, 0)`);
        g.addColorStop(0.97, `rgba(255, 255, 255, ${edgeA})`);
        g.addColorStop(1.00, `rgba(255, 255, 255, ${edgeA})`);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(deathWave.x, deathWave.y, deathWave.r, 0, Math.PI * 2); ctx.fill();

        // outer stroke: 50% opacity
        ctx.strokeStyle = `rgba(255, 255, 255, ${Math.max(0, dalpha) * 0.5})`;
        ctx.lineWidth = 6;
        ctx.beginPath(); ctx.arc(deathWave.x, deathWave.y, deathWave.r, 0, Math.PI * 2); ctx.stroke();

        ctx.restore();
      }

      // bricks
      const glowReady = glowCache.ready;
      const baseAlpha = 0.50;
      const ampAlpha  = 0.50;

      bricks.forEach(b => {
        if (b.state === 'dead') return;

        const ds = getBrickIntroDrawState(b);
        if (ds.alpha <= 0.001) return;

        const bx = ds.x, by = ds.y;

        if (glowReady && b.type < 3 && glowCache.canv[b.type]) {
          let p = Math.sin((b.animTicks * b.pulseSpeed) + b.pulseOffset);
          let a = baseAlpha + ((p + 1) * 0.5) * ampAlpha;
          ctx.save();
           const gcx = bx + 45, gcy = by + 12;
           ctx.translate(gcx, gcy);
           const gsc = ds.scale || 1;
           ctx.scale(gsc, gsc);
           ctx.translate(-45, -12);
           ctx.globalAlpha = a * ds.alpha;
           ctx.drawImage(glowCache.canv[b.type], -GLOW_PAD, -GLOW_PAD, GLOW_W, GLOW_H);
           ctx.restore();
           ctx.globalAlpha = 1.0;
        }

        ctx.save();
        // scale around brick center
        const cx = bx + 45, cy = by + 12;
        ctx.translate(cx, cy);
        ctx.scale(ds.scale || 1, ds.scale || 1);
        ctx.translate(-45, -12);

        // sprite
        ctx.globalAlpha = ds.alpha;
        ctx.drawImage(spriteSheet, 740 + (b.animFrame * 94), 160 + (b.type * 28), 90, 24, 0, 0, 90, 24);

        // shadow veil (fade from black)
        if (ds.shadow && ds.shadow > 0.001) {
          ctx.globalAlpha = ds.shadow * 0.25;
          ctx.fillStyle = 'rgb(21, 23, 24)';
          ctx.fillRect(0, 0, 90, 24);
        }

        ctx.restore();
        ctx.globalAlpha = 1.0;
      });

// paddle
      ctx.drawImage(spriteSheet, 740, 4, 200, 20, paddle.x, paddle.y, 200, 20);
      ctx.drawImage(spriteSheet, 740, 40, 200, 64, paddle.x, paddle.y + 20, 200, 64);

      // Flick-to-launch cue (only visible while ball is docked)

drawLaunchCue();

      // ball (with spawn cue)
      if (ball.active || ball.state === "docked") {
        // Spawn cue: 30px ring collapses to center, then ball becomes fully opaque.
        if (ballSpawnFx.active && ball.state === "docked") {
          const t = Math.min(1, ballSpawnFx.t / Math.max(1e-6, ballSpawnFx.dur));
          const r = Math.max(0, ballSpawnFx.r0 * (1 - t));
          if (r > 0.25) {
            ctx.save();
            ctx.globalAlpha = 1.0;
            ctx.lineWidth = 2;
            ctx.strokeStyle = "rgba(195, 204, 206, 0.5)";
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, r, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }
        }

        const a = (ballSpawnFx.active) ? ballRenderAlpha : 1.0;
        ctx.globalAlpha = a;

// mid-ghost (visual smoothing) - does NOT affect physics
const canGhost = (ball.active && ball.state !== "docked" && ballWasActive);
if (canGhost) {
  const mx = (ball.px + ball.x) * 0.5;
  const my = (ball.py + ball.y) * 0.5;
  ctx.globalAlpha = a * 0.35;
  ctx.drawImage(spriteSheet, 740, 120, 32, 32, mx - 16, my - 16, 32, 32);
}

// main
ctx.globalAlpha = a;
ctx.drawImage(spriteSheet, 740, 120, 32, 32, ball.x - 16, ball.y - 16, 32, 32);
ctx.globalAlpha = 1.0;
      }

      // particles
      particles.forEach(p => {
        const alphaMul = (p.alphaMul === undefined) ? 1.0 : p.alphaMul;
        const rgb = (p.color === 'BLUE') ? '120, 200, 255'
          : (p.color.includes('177') ? '177, 41, 26'
          : (p.color.includes('117') ? '117, 125, 128' : '195, 204, 206'));
        const life01 = Math.max(0, Math.min(1, p.life));
        // Lifetime taper: linger early, dissolve fast near the end (nebulous)
        const lifeCurve = life01 * life01;
        const sizeCurve = 0.80 + 0.20 * lifeCurve;
        ctx.fillStyle = `rgba(${rgb}, ${(lifeCurve * 0.6) * alphaMul})`;
        ctx.fillRect(p.x, p.y, p.size * sizeCurve, p.size * sizeCurve);
      });

      // trail (existing trail fades out even when the ball stops emitting)
      // trail (existing trail fades out even when the ball stops emitting)
      const tl = Math.max(1, ballTrail.length);
      ballTrail.forEach((t, i) => {
        const life = (t.life === undefined) ? 1.0 : Math.max(0, t.life);

        // New sampling emits more points; reduce per-point opacity a bit.
        const a = (i / tl) * 0.14 * life * 0.75;
        const r = 5.5 * (0.85 + (i / tl * 0.15)) * (0.6 + (life * 0.4));

        ctx.fillStyle = `rgba(195, 204, 206, ${a})`;
        ctx.beginPath(); ctx.arc(t.x, t.y, r, 0, Math.PI * 2); ctx.fill();
      });

      // HUD text
      ctx.font = "900 18px 'Arial Black', sans-serif";
      ctx.fillStyle = COLOR_WHITE;
      ctx.textAlign = "left";
      ctx.fillText("TRUTHS", 15, 38);

      let startX = 115;
      for (let i = 0; i < 3; i++) {
        ctx.strokeStyle = COLOR_GREY; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(startX + (i * 24), 32, 8, 0, Math.PI * 2); ctx.stroke();
        if (i < (lives - 1)) ctx.drawImage(spriteSheet, 740, 120, 32, 32, startX + (i * 24) - 8, 32 - 8, 16, 16);
      }

      ctx.fillText("LIES: " + score, 230, 38);

      ctx.textAlign = "center";
      let lvlText = currentLevel > 10 ? "LEVEL G" + (currentLevel - 10) : "LEVEL 0" + currentLevel;
      ctx.fillText(lvlText, 460, 38);

      ctx.textAlign = "right";
      ctx.fillText(fps + " FPS", 705, 38);
    }

    function drawPauseOverlay() {
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fillRect(0,0,720,1280);
      ctx.font = "900 48px 'Arial Black', sans-serif";
      ctx.fillStyle = COLOR_WHITE;
      ctx.textAlign = "center";
      ctx.shadowColor = COLOR_RED;
      ctx.shadowBlur = 20;

    document.addEventListener('DOMContentLoaded', () => {
      try { startInitScreen(); } catch(e) {}
      try { setInitReady(false); } catch(e) {}
      try { runInitializationSequence(); } catch(e) {}
      const btn = document.getElementById('init-btn');
      if (btn) {
        btn.addEventListener('click', async () => {
          if (!initState.ready) return;
          await primeAudioOnce();
          completeInitAndRevealMenu();
        });
      }

      fader = document.getElementById('fader');
      canvas = document.getElementById('gameCanvas');
      ctx = canvas.getContext('2d');
      endBubblesCanvas = document.getElementById('endBubblesCanvas');
      endBubblesCtx = endBubblesCanvas ? endBubblesCanvas.getContext('2d') : null;
      fxTopCanvas = document.getElementById('fxTopCanvas');
      fxTopCtx = fxTopCanvas ? fxTopCanvas.getContext('2d') : null;
      videoEl = document.getElementById('adh-video');

      loadGLevelsJsonOnce();
      loadMainLevelsJsonOnce();
      loadAiLevelsJsonOnce();

      window.addEventListener('resize', resizeGame);
      videoEl.onended = () => closeVideo();
      resizeGame();

      window.addEventListener('touchstart', (e) => {
        lastTouchInputT = performance.now();
        let rect = canvas.getBoundingClientRect();
        let tX = (e.touches[0].clientX - rect.left) / scale;
        let tY = (e.touches[0].clientY - rect.top) / scale;

        touchStartX = tX; touchStartY = tY; touchStartT = Date.now();
        launchCandidate = false;

        if (isVideoPlaying && tY > 1000) { closeVideo(); return; }

        if (currentLevel > 0 && !isVideoPlaying) {
          // Pause control covers only the playfield: below the score/HUD and above the paddle.
          // Do not let touches in the score area toggle the game state.
          const pauseBottom = paddle.y - PAUSE_ZONE_GAP;
          if (tY >= PAUSE_ZONE_TOP && tY < pauseBottom) { toggleGameState(); return; }
          if (isRunning) {
            if (ball.state === "docked" && !shockwave.active && !ballSpawnFx.active && ballRenderAlpha >= 1.0) { launchCandidate = true; }
            paddle.off = tX - paddle.x;
          }
        }
      });

      window.addEventListener('touchmove', (e) => {
        if (!isRunning) return;
        var rect = canvas.getBoundingClientRect();
        paddle.x = ((e.touches[0].clientX - rect.left) / scale) - paddle.off;
      });

      window.addEventListener('touchend', (e) => {
        if (isVideoPlaying) return;
        if (!isRunning || currentLevel === 0) return;

        const endT = Date.now();
        const dt = endT - touchStartT;

        // We only launch if we started a touch in the paddle control zone and the ball is docked.
        if (launchCandidate && ball.state === "docked" && !ballSpawnFx.active && ballRenderAlpha >= 1.0 && dt <= FLICK_MAX_MS) {
          // Use last known touch positions; touchend has no touches[0].
          // We'll infer end position from changedTouches if present.
          const rect = canvas.getBoundingClientRect();
          const ct = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0] : null;
          if (!ct) return;
          const endX = (ct.clientX - rect.left) / scale;
          const endY = (ct.clientY - rect.top) / scale;

          const dx = endX - touchStartX;
          const dy = endY - touchStartY; // upward is negative
          lastFlickDX = dx;
          lastFlickDY = dy;
          if (dy <= FLICK_MIN_DY) {
            launchBallFromDock(lastFlickDX, lastFlickDY);
          }
        }
      });

      // === DESKTOP MOUSE / POINTER CONTROLS ===
      // Direct pointer listeners on the game canvas are more reliable inside Wix's
      // sandboxed HTML iframe than window-level mouse listeners. Touch behavior above
      // remains unchanged; this block only responds to pointerType === "mouse".
      function getPointerGamePosition(e) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (e.clientX - rect.left) / scale,
          y: (e.clientY - rect.top) / scale
        };
      }

      function movePaddleWithPointer(gameX) {
        if (!isRunning || currentLevel === 0 || isVideoPlaying) return;
        paddle.x = Math.max(0, Math.min(720 - paddle.w, gameX - paddle.off));
      }

      function focusGameCanvas() {
        try { canvas.focus({ preventScroll: true }); }
        catch(e) { try { canvas.focus(); } catch(_) {} }
      }

      function isLaunchReady() {
        return currentLevel > 0 && !isVideoPlaying && isRunning &&
               ball.state === "docked" && !shockwave.active &&
               !ballSpawnFx.active && ballRenderAlpha >= 1.0;
      }

      function launchBallFromMouseClick() {
        // One click launches. The existing launchBallFromDock() applies the same
        // angle damping/clamp parameters used by touch.
        const velocity = Math.max(-6, Math.min(6, paddle.vx || 0));
        const mouseFlickDX = velocity * 2.5;
        const mouseFlickDY = FLICK_MIN_DY;
        launchBallFromDock(mouseFlickDX, mouseFlickDY);
      }

      function isMouseLaunchArea(p) {
        // Generous invisible target around the paddle.
        // The top edge starts exactly at the bottom of the pause zone, leaving
        // the 50px safety gap above the paddle.
        const launchLeft = paddle.x - 70;
        const launchRight = paddle.x + paddle.w + 70;
        const launchTop = paddle.y - PAUSE_ZONE_GAP;
        const launchBottom = paddle.y + paddle.h + 70;
        return p.x >= launchLeft && p.x <= launchRight &&
               p.y >= launchTop && p.y <= launchBottom;
      }

      canvas.tabIndex = 0;
      canvas.setAttribute('aria-label', 'Brick ShiftOut game area');

      canvas.addEventListener('pointerdown', (e) => {
        if (e.pointerType !== 'mouse' || e.button !== 0) return;
        if (performance.now() - lastTouchInputT < 500) return;

        focusGameCanvas();
        mouseDown = true;
        const p = getPointerGamePosition(e);
        mouseStartX = p.x;
        mouseStartY = p.y;
        mouseStartT = performance.now();
        mouseLaunchCandidate = false;

        try { canvas.setPointerCapture(e.pointerId); } catch(_) {}

        if (isVideoPlaying) {
          if (p.y > 1000) closeVideo();
          mouseDown = false;
          return;
        }

        if (currentLevel > 0) {
          // Keep the pause hit zone safely above the paddle/rebound area.
          const pauseBottom = paddle.y - PAUSE_ZONE_GAP;
          if (p.y >= PAUSE_ZONE_TOP && p.y < pauseBottom) {
            toggleGameState();
            mouseDown = false;
            return;
          }

          if (isRunning) {
            // Preserve the grab point when dragging.
            paddle.off = p.x - paddle.x;
            movePaddleWithPointer(p.x);

            // Large invisible launch target around the paddle.
            if (isLaunchReady() && isMouseLaunchArea(p)) {
              launchBallFromMouseClick();
              mouseDown = false;
              mouseLaunchCandidate = false;
              return;
            }
          }
        }
      });

      canvas.addEventListener('pointermove', (e) => {
        if (e.pointerType !== 'mouse') return;
        if (performance.now() - lastTouchInputT < 500) return;
        if (!isRunning || currentLevel === 0 || isVideoPlaying) return;

        const p = getPointerGamePosition(e);
        if (!mouseDown) paddle.off = paddle.w * 0.5;
        movePaddleWithPointer(p.x);
      });

      canvas.addEventListener('pointerup', (e) => {
        if (e.pointerType !== 'mouse' || e.button !== 0) return;
        mouseDown = false;
        mouseLaunchCandidate = false;
        try { canvas.releasePointerCapture(e.pointerId); } catch(_) {}
      });

      canvas.addEventListener('pointercancel', (e) => {
        if (e.pointerType !== 'mouse') return;
        mouseDown = false;
        mouseLaunchCandidate = false;
        try { canvas.releasePointerCapture(e.pointerId); } catch(_) {}
      });

      // === ARROW KEY CONTROLS ===
      function keyboardLaunch() {
        if (keyboardLaunchConsumed) return;
        keyboardLaunchConsumed = true;
        if (isLaunchReady()) launchBallFromMouseClick();
      }

      window.addEventListener('keydown', (e) => {
        const key = e.key;
        if (key !== 'ArrowLeft' && key !== 'ArrowRight' && key !== 'ArrowUp') return;

        // Only consume the arrows while this embedded game is actually in play.
        if (currentLevel === 0 || isVideoPlaying) return;

        e.preventDefault();
        focusGameCanvas();

        if (key === 'ArrowLeft') keyboardLeftDown = true;
        if (key === 'ArrowRight') keyboardRightDown = true;
        if (key === 'ArrowUp') keyboardLaunch();
      });

      window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft') { e.preventDefault(); keyboardLeftDown = false; }
        if (e.key === 'ArrowRight') { e.preventDefault(); keyboardRightDown = false; }
        if (e.key === 'ArrowUp') { e.preventDefault(); keyboardLaunchConsumed = false; }
      });

      window.addEventListener('blur', () => {
        keyboardLeftDown = false;
        keyboardRightDown = false;
        keyboardLaunchConsumed = false;
      });

      document.addEventListener("visibilitychange", handleVisibilityChange);
      window.addEventListener("blur", handleWindowBlur);
      window.addEventListener("focus", handleWindowFocus);

      loop();
    });
  </script>
</head>
